name: Fedora RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tables:
    name: Check generated tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate src/nm1000_tables.h from re/traces
        run: |
          t=$(mktemp -d)
          cp re/traces/*.xz "$t" && xz -d "$t"/*.xz
          python3 re/tools/gen_tables.py "$t" "$t/warm_open.log" "$t/scan_300_color.log" > "$t/tables.h"
          diff -u src/nm1000_tables.h "$t/tables.h"

  rpm:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: dnf -y install git tar rpm-build gcc make 'pkgconfig(libusb-1.0)' sane-backends-devel
      - uses: actions/checkout@v4
      - name: Build RPM
        run: ./packaging/rpmbuild.sh
      - name: Inspect package
        run: |
          rpm -qlp dist/sane-backends-neat-[0-9]*.x86_64.rpm
          rpm -qp --requires dist/sane-backends-neat-[0-9]*.x86_64.rpm | grep -v '^rpmlib'
      - uses: actions/upload-artifact@v4
        with:
          name: sane-backends-neat-fc${{ matrix.fedora }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tables, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.rpm \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
